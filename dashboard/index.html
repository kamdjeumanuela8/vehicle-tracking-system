<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Vehicle Tracking System</title>
    

    <!-- Dashboard CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Leaflet Map CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <!-- Dashboard Authentication Guard -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import {
            getAuth,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBpN2g6cZnGKnhTJrQ_N3sfWrG8M141BQ0",
            authDomain: "vehicle-tracking-system-286dc.firebaseapp.com",
            databaseURL: "https://vehicle-tracking-system-286dc-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "vehicle-tracking-system-286dc",
            storageBucket: "vehicle-tracking-system-286dc.firebasestorage.app",
            messagingSenderId: "370639255839",
            appId: "1:370639255839:web:a93ce5db7b4fda41b6982a"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.replace("login.html");
            }
        });
    </script>
</head>

<body>

    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div>
                <h1>Smart Vehicle Tracking System</h1>
                <p>Real-Time Fleet Management Dashboard</p>
            </div>

            <a href="logout.html" class="logout-button">Logout</a>
        </div>
    </header>

    <main class="dashboard">

        <!-- Summary Cards -->
        <section class="cards">

            <div class="card">
                <h3>Total Vehicles</h3>
                <p id="totalVehicles">0</p>
            </div>

            <div class="card">
                <h3>Active Vehicles</h3>
                <p id="activeVehicles">0</p>
            </div>

            <div class="card">
                <h3>Offline Vehicles</h3>
                <p id="offlineVehicles">0</p>
            </div>

            <div class="card">
                <h3>Alerts</h3>
                <p id="alertCount">0</p>
            </div>

        </section>

        <!-- Live Map -->
        <section class="map-section">
            <h2>Live Vehicle Location</h2>

            <div id="map"></div>
        </section>

        <!-- Vehicle Information -->
        <section class="vehicle-section">
            <h2>Vehicle Information</h2>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Vehicle</th>
                            <th>Latitude</th>
                            <th>Longitude</th>
                            <th>Speed</th>
                            <th>Ignition</th>
                            <th>Status</th>
                        </tr>
                    </thead>

                    <tbody id="vehicleTableBody">
                        <tr>
                            <td colspan="6">
                                No vehicle data available
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <!-- Leaflet Map JavaScript -->
    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>

    <!-- Dashboard JavaScript -->
    <script src="app.js"></script>
</body>
</html>
