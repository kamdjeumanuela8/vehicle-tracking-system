<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Tracking System - Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f7fb;
        }

        .login-container {
            width: 380px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            font-size: 24px;
            color: #1f2937;
            margin-bottom: 8px;
        }

        .login-header p {
            font-size: 14px;
            color: #6b7280;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: bold;
            color: #374151;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #2563eb;
        }

        .login-button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-button:hover {
            background: #1d4ed8;
        }

        .login-button:disabled {
            background: #93c5fd;
            cursor: not-allowed;
        }

        .message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            min-height: 20px;
        }

        .message.error {
            color: #dc2626;
        }

        .message.success {
            color: #16a34a;
        }

        .footer {
            margin-top: 25px;
            text-align: center;
            font-size: 12px;
            color: #9ca3af;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="login-header">
            <h1>Vehicle Tracking System</h1>
            <p>Sign in to access the fleet management dashboard</p>
        </div>

        <form id="loginForm">

            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit" class="login-button" id="loginButton">
                Login
            </button>

            <div id="message" class="message"></div>

        </form>

        <div class="footer">
            Smart Vehicle Tracking and Fleet Management System
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import {
            getAuth,
            signInWithEmailAndPassword
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBpN2g6cZnGKnhTJrQ_N3sfWrG8M141BQ0",
            authDomain: "vehicle-tracking-system-286dc.firebaseapp.com",
            databaseURL: "https://vehicle-tracking-system-286dc-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "vehicle-tracking-system-286dc",
            storageBucket: "vehicle-tracking-system-286dc.firebasestorage.app",
            messagingSenderId: "370639255839",
            appId: "1:370639255839:web:a93ce5db7b4fda41b6982a"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const loginForm = document.getElementById("loginForm");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const loginButton = document.getElementById("loginButton");
        const message = document.getElementById("message");

        loginForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            message.textContent = "";
            message.className = "message";

            loginButton.disabled = true;
            loginButton.textContent = "Signing in...";

            try {
                await signInWithEmailAndPassword(auth, email, password);
                  window.location.href="index.html";
                message.textContent = "Login successful. Opening dashboard...";
                message.className = "message success";

                setTimeout(() => {
                    window.location.href = "index.html";
                }, 800);

            } catch (error) {
                console.error(error);

                message.textContent = "Invalid email or password.";
                message.className = "message error";

                loginButton.disabled = false;
                loginButton.textContent = "Login";
            }
        });
    </script>
</body>
</html>
