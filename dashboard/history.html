<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vehicle History</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <link rel="stylesheet" href="history.css">
</head>

<body>

    <div class="page-container">

        <header class="history-header">
            <div>
                <h1>Vehicle History</h1>
                <p>View previous vehicle movements and tracking records.</p>
            </div>

            <a class="back-btn history-button" href="index.html">← Dashboard</a>
        </header>


        <!-- FILTER SECTION -->
        <section class="filter-card">

            <div class="filter-group">
                <label for="vehicleSelect">Vehicle</label>

                <select id="vehicleSelect">
                    <option value="">All Vehicles</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="dateFrom">From</label>
                <input type="date" id="dateFrom">
            </div>

            <div class="filter-group">
                <label for="dateTo">To</label>
                <input type="date" id="dateTo">
            </div>

            <button id="searchBtn" class="search-btn">
                Search
            </button>

            <button id="clearBtn" class="clear-btn">
                Clear
            </button>

        </section>


        <!-- SUMMARY -->
        <section class="summary-grid">

            <div class="summary-card">
                <span>Total Records</span>
                <strong id="recordCount">0</strong>
            </div>

            <div class="summary-card">
                <span>Maximum Speed</span>
                <strong id="maxSpeed">0 km/h</strong>
            </div>

            <div class="summary-card">
                <span>Current Ignition</span>
                <strong id="currentIgnition">--</strong>
            </div>

        </section>


        <!-- MAP -->
        <section class="map-card">

            <div class="section-title">
                <h2>Vehicle Route</h2>
                <span id="mapStatus">Waiting for tracking data...</span>
            </div>

            <div id="historyMap"></div>

        </section>


        <!-- TABLE -->
        <section class="table-card">

            <div class="section-title">
                <h2>Tracking Records</h2>
            </div>

            <div class="table-wrapper">

                <table>

                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Date & Time</th>
                            <th>Latitude</th>
                            <th>Longitude</th>
                            <th>Speed</th>
                            <th>Ignition</th>
                            <th>Status</th>
                        </tr>
                    </thead>

                    <tbody id="historyTableBody">

                        <tr>
                            <td colspan="7" class="empty-message">
                                Loading tracking records...
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </div>


    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script type="module" src="history .js"></script>

</body>
</html>
